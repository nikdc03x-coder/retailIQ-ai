[build-system]
requires = ["setuptools>=75", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "retailiq-ai"
version = "0.12.0"
description = "Historical retail analytics, evaluated forecasts, and grounded business answers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.50,<2",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "plotly>=5.24,<7",
    "pyarrow>=18,<27",
    "scikit-learn>=1.5,<2",
    "xgboost>=2.1,<4",
    "joblib>=1.4,<2",
    "python-dotenv>=1,<2",
    "matplotlib>=3.8,<4",
    "shap>=0.46,<1",
    "google-genai>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "build>=1,<2"]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]

[project.scripts]
retailiq = "retailiq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires local raw datasets or generated research reports"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data", "models", "reports", "13_results"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

